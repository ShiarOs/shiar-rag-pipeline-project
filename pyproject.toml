[project]
name = "mle-rag-pipeline-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "faiss-cpu>=1.15.1",
    "numpy>=2.2.6",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[project.scripts]
northstar-rag = "northstar_rag.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
